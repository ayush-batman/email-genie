services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: waypoint
      CLICKHOUSE_PASSWORD: waypoint
      CLICKHOUSE_DB: waypoint
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [chdata:/var/lib/clickhouse]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: {}
  chdata: {}
