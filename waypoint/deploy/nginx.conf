# Round-robin across app replicas. Sessions and rate limits live in Redis, so any replica can serve any request.
upstream waypoint { server app1:3000; server app2:3000; keepalive 32; }
server {
  listen 80;
  client_max_body_size 110m;  # data imports
  location / {
    proxy_pass http://waypoint;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;        # live dashboard (Server-Sent Events)
    proxy_read_timeout 1h;
  }
}
